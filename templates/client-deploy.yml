# MUSA client repository — build and publish pipeline (M0.7).
#
# This file is the TEMPLATE for the workflow that lives in every client
# repository at .github/workflows/deploy.yml (the DemoMuseum is the first).
# It replaces the placeholder that documented the plan; now the plan runs.
#
# What it enforces (docs/HANDOFF.md §5):
#   - the build runs INSIDE the pinned artifact image — zero MUSA code here;
#   - a ficha outside the contract FAILS the build (the previous site stays up,
#     because the deploy job only runs on a green build);
#   - gating happens in the build: no draft and nothing above the entitled tier
#     reaches the published payload;
#   - the build report (what went in, what stayed out, why) is kept as an
#     artifact of every run.
#
# One-time setup in the client repository:
#   1. Settings → Pages → Source = "GitHub Actions".
#   2. Settings → Secrets → Actions → new secret GHCR_PULL_TOKEN: a GitHub PAT
#      with read:packages on Agua-Games (the artifact image is private).
#   3. museum.config.json → "musa": "<published version>" (never a branch).

name: build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Validate and report without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this client repository
        uses: actions/checkout@v4

      - name: Read the pinned MUSA version
        id: pin
        run: |
          VERSION=$(jq -r .musa museum.config.json)
          echo "pinned MUSA version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      # The build fails (and the deploy below never runs) if any ficha violates
      # the contract or the pin does not match an existing artifact version.
      - name: Build the site with the pinned artifact
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" \
            "ghcr.io/agua-games/musa-app:${{ steps.pin.outputs.version }}" \
            build --repo /work --frontend /app/frontend --out /work/_site

      - name: Upload the build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: |
            _site/build-report.json
            _site/build-report.md
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Push always publishes; a manual run publishes unless dry-run was chosen.
    if: github.event_name == 'push' || inputs.dry-run != true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
