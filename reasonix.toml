# Reasonix project settings for the MUSA app-service workspace.
# Resolution order: CLI flag > ./reasonix.toml (this file) > global
# %APPDATA%\reasonix\config.toml > built-in defaults.
#
# Committed on purpose, like .vscode/, .cursor/, .zed/ and AGENTS.md: the team
# needs the same agent behaviour in this workspace.

[tools.shell]
# Git-for-Windows (MSYS) bash cannot start under the restricted token that the
# default `workspace-write` permission preset applies on Windows -- it dies with
# "couldn't create signal pipe, Win32 error 5" before running the command. Pin
# the shell tool to Windows PowerShell instead: `git`, `gh`, `node`, `npm` and
# `python` all work from it. Remove this block (or set "auto") on macOS/Linux.
#
# Verified 2026-09-21 (Origami workspace, same machine): the engine does honour
# this. `reasonix doctor` prints the resolved shell -- `shell powershell
# (... pwsh.exe)` there -- and an end-to-end probe ($PSVersionTable.PSVersion)
# returned the version with the preference set and the same signal-pipe failure
# with `auto`. `pwsh` (PowerShell 7) is the better value *where it is installed*,
# because 5.1 does not parse `&&` or `||`. The declaration below is **commented out** (2026-09-21, the owner's
# choice) so that the *machine* decides: with the key absent, resolution falls through to the user config, and on
# the machine this was tested on that config says `prefer = "pwsh"`. A committed file that pins a shell
# overrides the machine everywhere -- which is how a declared shell and an executing shell came to disagree.
# Uncomment the line below, and give it a `path`, on a machine that has to be pinned. Two caveats: the setting is read
# when a session starts, and a client that executes the command itself need not
# obey it -- if plain PowerShell text fails with "'...' is not recognized as an
# internal or external command", wrap explicitly in `pwsh -NoProfile -Command
# "..."` (PowerShell 7) or `powershell -NoProfile -Command "..."`.
# Which of the two shells an assistant wraps with, when it has the choice: `pwsh` first, and the difference is not
# cosmetic. Measured 2026-09-21 in both shells: `Set-Content` of `([char]0xA7 + ' test')` gives `C2 A7 ...` (valid
# UTF-8) under 7.6.3 and `A7 20 ...` (the ANSI codepage, so not UTF-8 at all) under 5.1; and `'one' && 'two'` runs in
# 7.6.3 while 5.1 refuses it at *parse* time, so the whole line is lost and not just the chaining. That is why
# `powershell` below is the *declared* value and `pwsh` is what a wrapper should name: the declaration is about what
# a machine certainly has, the wrapper about which dialect the payload is parsed in -- and they do not have to agree.
# If 5.1 is what runs, sequence with `;` and write no-BOM UTF-8 with
# `[IO.File]::WriteAllText($p, $t, (New-Object Text.UTF8Encoding($false)))` (there is no `utf8NoBOM` flag in 5.1,
# and `-Encoding utf8` writes a BOM).
# prefer = "powershell"   # auto|bash|powershell|pwsh; empty/default = auto-detect (see the note above)
