[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musa-app"
version = "0.1.3"
description = "MUSA app-service builder: turns a client content repository into the museum's static site."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20", "cryptography>=42"]

[project.scripts]
musa-build = "musa_build.cli:main"

[tool.setuptools.packages.find]
include = ["musa_build*"]

[tool.setuptools.package-data]
musa_build = ["schemas/*.json", "data/*.json", "data/*.key"]
