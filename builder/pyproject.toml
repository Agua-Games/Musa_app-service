[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musa-app"
version = "0.2.0"
description = "MUSA app-service builder: turns a client content repository into the museum's static site."
readme = "README.md"
requires-python = ">=3.10"
# fastapi+uvicorn power `musa-build serve` (M1.4); httpx is imported by the
# test suite's fastapi.testclient.TestClient, which the release gate runs.
dependencies = ["jsonschema>=4.20", "cryptography>=42", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
musa-build = "musa_build.cli:main"

[tool.setuptools.packages.find]
include = ["musa_build*"]

[tool.setuptools.package-data]
musa_build = ["schemas/*.json", "data/*.json", "data/*.key"]
