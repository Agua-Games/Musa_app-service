# Platform CI (M0.7): the gates that must stay green on every push.
#
# - the demo catalog validates against the frozen contract (schemas/ v1),
# - the frontend's module plumbing is sound (import map, vendored three.js),
# - the builder's test suite passes — including the test that fails if the
#   schema bundled in the artifact drifts from schemas/ (one source of truth).

name: platform CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the validation dependency
        run: python -m pip install --disable-pip-version-check ./builder

      # A workflow file that does not parse fails silently at 0s on every
      # push (M4.1 regression: unquoted "Smoke: ..." step name). Parse them
      # all here so the break is loud and immediate.
      - name: Lint the workflow files themselves
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'EOF'
          import glob, sys, yaml
          bad = []
          for f in glob.glob(".github/workflows/*.yml"):
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all workflow files parse")
          EOF

      - name: Validate the catalog against the contract
        run: python tools/validate_catalog.py

      - name: Check the frontend's module plumbing
        run: python tools/check_frontend.py

      - name: Run the builder test suite
        working-directory: builder
        run: python -m unittest discover -s tests

      - name: Run the MCP server test suite
        working-directory: mcp_server
        run: python -m unittest discover -s tests
