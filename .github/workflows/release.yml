# Release the musa-app artifact (M0.4, ADR 0006).
#
# A git tag vX.Y.Z is the release trigger: the workflow runs the full gate,
# builds the container image and pushes it to ghcr.io/agua-games/musa-app, then
# creates the GitHub Release — the canonical version record clients read before
# bumping the "musa" pin in museum.config.json.
#
# The image tag does NOT carry the "v" prefix, so it matches the pin verbatim:
#   tag v0.1.0  ->  ghcr.io/agua-games/musa-app:0.1.0  ->  "musa": "0.1.0"
#
# The release FAILS if the tag, builder/__init__.py __version__ and
# builder/pyproject.toml version disagree — a release can never lie about what
# it contains.

name: release the musa-app artifact

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check ./builder

      - name: The tag must equal the builder version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILDER=$(python -c "import sys; sys.path.insert(0, 'builder'); from musa_build import __version__; print(__version__)")
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('builder/pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG builder=$BUILDER pyproject=$PYPROJECT"
          test "$TAG" = "$BUILDER" && test "$TAG" = "$PYPROJECT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate the catalog against the contract
        run: python tools/validate_catalog.py

      - name: Check the frontend's module plumbing
        run: python tools/check_frontend.py

      - name: Run the builder test suite
        working-directory: builder
        run: python -m unittest discover -s tests

      - name: Run the MCP server test suite
        working-directory: mcp_server
        run: python -m unittest discover -s tests

  image:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the artifact image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/agua-games/musa-app:${{ needs.gate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [gate, image]
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            musa-app ${{ needs.gate.outputs.version }}

            Artifact: `ghcr.io/agua-games/musa-app:${{ needs.gate.outputs.version }}`

            Client upgrade: set `"musa": "${{ needs.gate.outputs.version }}"` in
            `museum.config.json` and push — the client CI builds with the new image.
