# Publish the static frontend in `source/` to GitHub Pages.
#
# Why a workflow instead of "Deploy from a branch": a branch deployment can only
# serve the repository root or a top-level `docs/` folder -- GitHub Pages does
# not let you pick `source/`. Actions can upload ANY directory as the site root,
# so the frontend keeps its own folder and `docs/` stays the design docs
# (see docs/HANDOFF.md §2). Select "GitHub Actions" as the Pages source once in
# Settings -> Pages.
#
# The heavy assets are deliberately NOT in git (.gitignore: *.glb, and the
# three.js vendor bundle per docs/adr/0004). They are reproduced here at build
# time by this repository's own fetchers, so the published site is complete
# without versioning binaries.

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      # The gate travels with the build: a ficha that violates the contract
      # fails the deploy instead of reaching the site (docs/HANDOFF.md §5).
      - name: Validate the catalog against the contract
        run: python tools/validate_catalog.py

      # three.js is a runtime dependency served from assets/vendor/ (import map
      # in source/index.html) and is not versioned.
      - name: Vendor three.js
        run: python tools/fetch_vendor.py

      # GLB models are not versioned; venus-de-milo.glb is a manual step, so a
      # non-zero exit here is expected and only affects that one piece -- its
      # viewer degrades gracefully.
      - name: Fetch the 3D models
        run: python tools/fetch_models.py || echo "::warning::venus-de-milo.glb is a manual model and is not in the published build"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: source

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
