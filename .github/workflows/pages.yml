# Publish the static frontend in `source/` to GitHub Pages.
#
# Why a workflow instead of "Deploy from a branch": a branch deployment can only
# serve the repository root or a top-level `docs/` folder -- GitHub Pages does
# not let you pick `source/`. Actions can upload ANY directory as the site root,
# so the frontend keeps its own folder and `docs/` stays the design docs
# (see docs/HANDOFF.md §2). Select "GitHub Actions" as the Pages source once in
# Settings -> Pages.
#
# The media assets ARE versioned as of 2026-09-18 (see .gitignore and HANDOFF
# §5.3): the GLB models and the demo JPEGs ship with the repository, because the
# published demo needs a working WebGL viewer and there is no object store yet.
# The fetchers below are kept as a fallback and are a no-op on a full checkout --
# they skip any file already present at the exact expected size.

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      # The gate travels with the build: a card that violates the contract
      # fails the deploy instead of reaching the site (docs/HANDOFF.md §5).
      - name: Validate the catalog against the contract
        run: python tools/validate_catalog.py

      # three.js is a runtime dependency served from assets/vendor/ (import map
      # in source/index.html) and is not versioned.
      - name: Vendor three.js
        run: python tools/fetch_vendor.py

      # GLB models are not versioned; venus-de-milo.glb is a manual step, so a
      # non-zero exit here is expected and only affects that one piece -- its
      # viewer degrades gracefully.
      - name: Fetch the 3D models
        run: python tools/fetch_models.py || echo "::warning::venus-de-milo.glb is a manual model and is not in the published build"

      # Frontend plumbing that only a browser exercises. An import map whose
      # value is a BARE specifier -- "assets/vendor/…" instead of
      # "./assets/vendor/…" -- is quietly normalised to null, and then every
      # `import ... from "three"` fails with "Resolution of specifier "three"
      # was blocked by a null entry": both WebGL viewers are dead while the page
      # looks fine (docs/HANDOFF.md §7). Gate the deploy on it.
      - name: Check the frontend's module plumbing
        run: python tools/check_frontend.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: source

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
